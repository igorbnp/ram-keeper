name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Verify tag and manifest agree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(python3 -c "import json;print(json.load(open('manifest.json'))['version'])")
          echo "tag=$tag manifest=$ver"
          [ "$tag" = "$ver" ] || { echo "::error::tag $tag does not match manifest version $ver"; exit 1; }

      - name: Run the test suite
        run: bash tests/ci-suite.sh

      - name: Build the source archives
        run: |
          name="ram-keeper-${GITHUB_REF_NAME}"
          git archive --format=tar.gz --prefix="${name}/" -o "${name}.tar.gz" HEAD
          git archive --format=zip    --prefix="${name}/" -o "${name}.zip" HEAD
          sha256sum "${name}.tar.gz" "${name}.zip" > SHA256SUMS
          ls -l "${name}".* SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ram-keeper-*.tar.gz
            ram-keeper-*.zip
            SHA256SUMS
          generate_release_notes: true
          draft: false
          prerelease: false
