name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Verify tag and manifest agree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(python3 -c "import json;print(json.load(open('manifest.json'))['version'])")
          echo "tag=$tag manifest=$ver"
          [ "$tag" = "$ver" ] || { echo "::error::tag $tag does not match manifest version $ver"; exit 1; }

      - name: Run the test suite
        run: |
          python3 -m pip install --quiet pytest
          python3 -m pytest -q tests/test_ram_keeper_core.py \
            tests/test_integration.py tests/test_process_guardian.py \
            tests/test_bugfixes.py tests/test_reclaim_policy.py \
            tests/test_config_attacks.py tests/test_unit_hardening.py \
            tests/test_config_isolation.py
          python3 tests/test_critical_metrics.py
          python3 tests/test_qml_structure.py
          python3 tests/test_pass_budget.py

      - name: Build the source archives
        run: |
          name="ram-keeper-${GITHUB_REF_NAME}"
          git archive --format=tar.gz --prefix="${name}/" -o "${name}.tar.gz" HEAD
          git archive --format=zip    --prefix="${name}/" -o "${name}.zip" HEAD
          sha256sum "${name}.tar.gz" "${name}.zip" > SHA256SUMS
          ls -l "${name}".* SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ram-keeper-*.tar.gz
            ram-keeper-*.zip
            SHA256SUMS
          generate_release_notes: true
          draft: false
          prerelease: false
